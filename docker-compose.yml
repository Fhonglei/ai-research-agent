services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MODEL: ${MODEL:-deepseek-chat}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      MAX_TOPIC_LENGTH: ${MAX_TOPIC_LENGTH:-500}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-5}
      FETCH_TOP_N: ${FETCH_TOP_N:-3}
      MAX_PARALLEL_RESEARCH_TASKS: ${MAX_PARALLEL_RESEARCH_TASKS:-4}
      CONTENT_FETCH_TIMEOUT_SECONDS: ${CONTENT_FETCH_TIMEOUT_SECONDS:-10}
      CONTENT_FETCH_MAX_CHARS: ${CONTENT_FETCH_MAX_CHARS:-5000}
      REQUIRE_LLM_FOR_RESEARCH: ${REQUIRE_LLM_FOR_RESEARCH:-false}
      REPORTS_DIR: /app/reports
    volumes:
      - ./backend:/app
      - ./backend/reports:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
